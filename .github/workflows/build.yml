name: Windows build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Swift 6.4.0
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.swift.org/swift-6.4.0-release/windows10/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE-windows10.exe -OutFile "$env:RUNNER_TEMP\swift.exe"
          $install = Start-Process "$env:RUNNER_TEMP\swift.exe" -ArgumentList '/quiet', 'OptionsInstallAndroidPlatform=0', 'OptionsInstallIDE=0', 'OptionsInstallWindowsSDKARM64=0', 'OptionsInstallWindowsSDKX86=0', 'OptionsInstallWindowsRedistARM64=0', 'OptionsInstallWindowsRedistX86=0' -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -notin @(0,3010)) { throw "Swift install failed: $($install.ExitCode)" }
          $toolBin = Get-Item -LiteralPath "$env:LOCALAPPDATA\Programs\Swift\Toolchains\6.4.0+Asserts\usr\bin" -ErrorAction SilentlyContinue
          if ($null -eq $toolBin) { throw 'Swift toolchain bin directory was not found' }
          $toolBin.FullName | Out-File $env:GITHUB_PATH -Append
          $swiftRoot = Split-Path (Split-Path (Split-Path (Split-Path $toolBin.FullName)))
          $sdkRoot = Join-Path $swiftRoot 'Platforms\6.4.0\Windows.platform\Developer\SDKs\Windows.sdk'
          if (!(Test-Path -LiteralPath $sdkRoot -PathType Container)) { throw 'Swift Windows SDK directory was not found' }
          "SDKROOT=$sdkRoot" | Out-File $env:GITHUB_ENV -Append
          "SWIFTSDKROOT=$sdkRoot" | Out-File $env:GITHUB_ENV -Append
      - name: Build, Swift tests and native Windows smoke test
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Package
        shell: pwsh
        run: ./build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AeroSpace-Windows-x64
          path: .release/AeroSpace-Windows-x64.zip
