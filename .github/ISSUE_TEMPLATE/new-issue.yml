name: Windows bug report
description: Report a problem in the Windows port
body:
  - type: input
    id: version
    attributes:
      label: AeroSpace and Windows versions
      description: Include aerospace --version and your Windows version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include affected applications and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Configuration and diagnostics
      description: Share relevant configuration, list-windows/list-monitors output, or screenshots. Remove private titles and paths.
